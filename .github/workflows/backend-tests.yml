name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: snhu-foodwaste-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Unit + integration tests (isolated CI database)
        run: npx jest --ci
      - name: Root (Vercel function) dependencies install cleanly
        working-directory: .
        run: npm ci
